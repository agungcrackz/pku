services:
  - type: web
    name: pku-air-quality
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
